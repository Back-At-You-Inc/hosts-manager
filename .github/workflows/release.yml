name: Build Hosts Manager
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosts-manager-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Prepare release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: release-version
        run: node scripts/release-version.mjs
  build:
    name: Test and build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
          - runner: ubuntu-22.04
            target: linux
          - runner: windows-2022
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      HOSTS_MANAGER_RELEASE_REPOSITORY: ${{ github.repository }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set package version
        run: node scripts/release-version.mjs --set
      - run: npm test
      - run: npm run setup:packaging
      - run: npm run package -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/Hosts-Manager-*.dmg
            release/Hosts-Manager-*.zip
            release/Hosts-Manager-*.exe
            release/Hosts-Manager-*.AppImage
            release/Hosts-Manager-*.tar.gz
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish successful build
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: node scripts/create-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
  notify:
    name: Notify
    needs: [version, build, release]
    if: always()
    uses: Back-At-You-Inc/gh-actions/.github/workflows/build-notification.yml@v1
    with:
      product-name: Hosts Manager
      build-info: |
        Version=${{ needs.version.outputs.version }}
        Platforms=macOS ARM64, Windows x64, Linux x64
      statuses: |
        Build & Push=${{ needs.version.result == 'success' && needs.build.result || needs.version.result }}
        Release Tag=${{ needs.release.result }}
      links: |
        Artifacts=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ${{ needs.release.result == 'success' && format('Release=https://github.com/{0}/releases/tag/v{1}', github.repository, needs.version.outputs.version) || '' }}
    secrets: inherit
