name: Build Hosts Manager
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosts-manager-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Prepare release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: release-version
        run: node scripts/release-version.mjs
  build:
    name: Test and build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
          - runner: ubuntu-22.04
            target: linux
          - runner: windows-2022
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      HOSTS_MANAGER_RELEASE_REPOSITORY: ${{ github.repository }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set package version
        run: node scripts/release-version.mjs --set
      - run: npm test
      - name: Test Linux installer
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s test -p linux_installer_test.py
      - run: npm run setup:packaging
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm
      - run: npm run package -- ${{ matrix.target }}
      - name: Validate Linux native packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="release/Hosts-Manager-${RELEASE_VERSION}-linux-x64.deb"
          rpm="release/Hosts-Manager-${RELEASE_VERSION}-linux-x64.rpm"
          test "$(dpkg-deb --field "$deb" Package)" = hosts-manager
          test "$(dpkg-deb --field "$deb" Architecture)" = amd64
          dpkg-deb --field "$deb" Depends | grep -F 'pkexec'
          test "$(rpm -qp --queryformat '%{NAME}' "$rpm")" = hosts-manager
          test "$(rpm -qp --queryformat '%{ARCH}' "$rpm")" = x86_64
          rpm -qp --requires "$rpm" | grep -Fx 'polkit'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/Hosts-Manager-*.dmg
            release/Hosts-Manager-*.zip
            release/Hosts-Manager-*.exe
            release/Hosts-Manager-*.AppImage
            release/Hosts-Manager-*.tar.gz
            release/Hosts-Manager-*.deb
            release/Hosts-Manager-*.rpm
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish successful build
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: node scripts/create-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
      - name: Update Homebrew cask
        if: needs.version.outputs.prerelease == 'false'
        run: node scripts/update-homebrew-cask.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
      - name: Refresh README release badge
        if: needs.version.outputs.prerelease == 'false'
        continue-on-error: true
        run: node scripts/update-release-badge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
