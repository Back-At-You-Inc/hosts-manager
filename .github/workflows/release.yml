name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
          - runner: ubuntu-22.04
            target: linux
          - runner: windows-2022
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      HOSTS_MANAGER_RELEASE_REPOSITORY: ${{ github.repository }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm run setup:packaging
      - run: npm test
      - run: npm run package -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/Hosts-Manager-*.dmg
            release/Hosts-Manager-*.zip
            release/Hosts-Manager-*.exe
            release/Hosts-Manager-*.AppImage
            release/Hosts-Manager-*.tar.gz
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: node scripts/create-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
